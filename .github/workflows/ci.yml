name: CI

# Déclenchement manuel uniquement. Le dépôt est privé : chaque exécution
# consomme des minutes facturables, et le plafond de dépense Actions reste à
# 0 USD. La séquence de validation ci-dessous est exactement celle qui tourne
# en local avant chaque push (voir AGENTS.md) ; la lancer ici sert à prouver un
# jalon sur un environnement neuf, pas à filtrer le travail courant.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: NEXT_TELEMETRY_DISABLED=1 pnpm exec next typegen
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit --incremental false
      - run: pnpm test
      - run: pnpm test:rls
      - run: pnpm test:schema
      - run: NEXT_TELEMETRY_DISABLED=1 pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/public.spec.ts
